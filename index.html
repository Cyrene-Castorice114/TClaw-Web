<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06070c">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TClaw">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>TClawの导航页</title>

  <meta name="description" content="TClaw-MiaoNekoの个人主页咪!">
  <meta name="keywords" content="TClaw-MiaoNekoの个人主页咪!">
  <meta name="author" content="TClaw">
  <link rel="canonical" href="https://tclaw.mengniang.ink/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="TClawの导航页">
  <meta property="og:description" content="TClaw-MiaoNekoの个人主页咪!">
  <meta property="og:image" content="https://tclaw.mengniang.ink/assets/favicon.png">
  <meta property="og:url" content="https://tclaw.mengniang.ink/">
  <meta property="og:site_name" content="TClawの导航页">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TClawの导航页">
  <meta name="twitter:description" content="TClaw-MiaoNekoの个人主页咪!">
  <meta name="twitter:image" content="https://tclaw.mengniang.ink/assets/favicon.png">

  <link rel="preconnect" href="https://www.loliapi.com" crossorigin>
  <link rel="preconnect" href="https://favicon.im" crossorigin>
  <link rel="preconnect" href="https://icons.duckduckgo.com" crossorigin>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <script src="js/vendor/marked.min.js"></script>

  <script src="js/theme-init.js?v=23"></script>

  <link rel="stylesheet" href="css/style.css?v=23">
  <link rel="stylesheet" href="css/click-fx.css?v=23">
  <link rel="stylesheet" href="css/bg-image.css?v=23">
  <link rel="stylesheet" href="css/loading.css?v=23">
  <link rel="stylesheet" href="css/section.css?v=23">
  <link rel="stylesheet" href="css/particle-fx.css?v=23">
  <link rel="stylesheet" href="css/skeleton.css?v=23">
  <link rel="stylesheet" href="css/theme.css?v=23">
  <link rel="stylesheet" href="css/leave-warning.css?v=23">
  <link rel="stylesheet" href="css/bg-viewer.css?v=23">
  <link rel="stylesheet" href="css/ui-polish.css?v=23">
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-status" id="loadingDetail"></div>
  </div>

  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="layout">

    <aside class="glass profile">
      <div class="profile-top">
        <div class="avatar">
          <img id="avatarImg" src="" alt="头像">
        </div>
        <div class="profile-info">
          <h1 class="name" id="profileName"></h1>
          <p  class="role" id="profileRole"></p>
          <p  class="bio"  id="profileBio"></p>
        </div>
      </div>

      <div class="profile-bottom">
        <a class="contact-btn" id="contactBtn" href="#">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
          <span class="btn-text">联系猫猫喵</span>
        </a>
      </div>
    </aside>

    <main class="glass panel">
      <div class="panel-head">
        <div>
          <h2 id="panelTitle"></h2>
          <p  id="panelSubtitle"></p>
        </div>
        <div class="badge" id="count">—</div>
      </div>

      <div class="grid" id="grid"></div>
      <div class="sections" id="sections"></div>
    </main>

  </div>

  <!-- 查看背景图按钮 -->
  <button class="bg-view-fab" id="bgViewBtn" type="button" aria-label="查看背景图">
    <svg class="bg-view-fab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <span class="bg-view-fab-tip">查看背景图</span>
  </button>

  <!-- GitHub 悬浮按钮 -->
  <a class="github-fab"
     href="https://github.com/Cyrene-Castorice114/TClaw-Web"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="在GitHub上查看源码">
    <svg class="github-fab-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    <span class="github-fab-tip">在GitHub上查看源码</span>
  </a>

  <!-- DreamCloud 防护徽章 -->
  <div class="protection-badge">
    <img class="protection-badge-icon"
         src="https://link.mengniang.ink/images/favicon.png"
         alt=""
         onerror="this.style.display='none'">
    <span class="protection-badge-tip">
      由 <a href="https://www.edmc.cn" target="_blank" rel="noopener noreferrer" data-no-warning>Dream-Cloud</a> 提供防护
    </span>
  </div>

  <!-- 背景图弹窗 -->
  <div class="bg-viewer-modal" id="bgViewerModal">
    <div class="bg-viewer-panel">
      <div class="bg-viewer-header">
        <h3 class="bg-viewer-title">当前背景图</h3>
        <button class="bg-viewer-close" id="bgViewerClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="bg-viewer-body" id="bgViewerBody">
        <img class="bg-viewer-img" id="bgViewerImg" src="" alt="当前背景图">
        <div class="bg-viewer-empty" id="bgViewerEmpty" style="display:none;">暂未加载背景图</div>
      </div>
      <div class="bg-viewer-footer">
        <button class="bg-viewer-save" id="bgViewerSave" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>觉得还行？保存此图片</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=23"></script>
  <script src="js/utils.js?v=23"></script>
  <script src="js/loading.js?v=23"></script>
  <script src="js/icons.js?v=23"></script>
  <script src="js/render.js?v=23"></script>
  <script src="js/readme.js?v=23"></script>

  <script src="js/app.js?v=23"></script>

  <script src="js/click-fx.js?v=23"></script>
  <script src="js/title-fx.js?v=23"></script>
  <script src="js/particle-fx.js?v=23"></script>

  <script src="js/bg-image.js?v=23"></script>

  <script src="js/theme.js?v=23"></script>
  <script src="js/leave-warning.js?v=23"></script>
  <script src="js/bg-viewer.js?v=23"></script>
</body>
</html>
