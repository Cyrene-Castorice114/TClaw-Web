<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06070c">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TClaw">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>TClawの导航页</title>

  <meta name="description" content="TClaw-MiaoNekoの个人主页咪!">
  <meta name="keywords" content="TClaw-MiaoNekoの个人主页咪!">
  <meta name="author" content="TClaw">
  <link rel="canonical" href="https://github.com/Cyrene-Castorice114/TClaw-Web">

  <meta property="og:type" content="website">
  <meta property="og:title" content="TClawの导航页">
  <meta property="og:description" content="TClaw-MiaoNekoの个人主页咪!">
  <meta property="og:image" content="assets/favicon.png">
  <meta property="og:url" content="https://github.com/Cyrene-Castorice114/TClaw-Web">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TClawの导航页">
  <meta name="twitter:description" content="TClaw-MiaoNekoの个人主页咪!">
  <meta name="twitter:image" content="assets/favicon.png">

  <link rel="preconnect" href="https://www.loliapi.com" crossorigin>
  <link rel="preconnect" href="https://favicon.im" crossorigin>
  <link rel="preconnect" href="https://icons.duckduckgo.com" crossorigin>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <script src="js/vendor/marked.min.js"></script>

  <script src="js/theme.js?v=6"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/click-fx.css">
  <link rel="stylesheet" href="css/bg-image.css">
  <link rel="stylesheet" href="css/loading.css">
  <link rel="stylesheet" href="css/section.css">
  <link rel="stylesheet" href="css/particle-fx.css?v=6">
  <link rel="stylesheet" href="css/skeleton.css?v=6">
  <link rel="stylesheet" href="css/theme.css?v=6">
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <p class="loading-title">正在加载必要的资源...</p>
      <p class="loading-detail" id="loadingDetail">正在初始化网站</p>
      <div class="loading-bar">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
      </div>
    </div>
  </div>

  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="layout">

    <aside class="glass profile">
      <div class="profile-top">
        <div class="avatar">
          <img id="avatarImg" src="" alt="头像">
        </div>
        <div class="profile-info">
          <h1 class="name" id="profileName"></h1>
          <p  class="role" id="profileRole"></p>
          <p  class="bio"  id="profileBio"></p>
        </div>
      </div>

      <div class="profile-bottom">
        <a class="contact-btn" id="contactBtn" href="#">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
          <span class="btn-text">联系猫猫喵</span>
        </a>
      </div>
    </aside>

    <main class="glass panel">
      <div class="panel-head">
        <div>
          <h2 id="panelTitle"></h2>
          <p  id="panelSubtitle"></p>
        </div>
        <div class="badge" id="count">—</div>
      </div>

      <div class="grid" id="grid"></div>
      <div class="sections" id="sections"></div>
    </main>

  </div>

  <a class="github-fab"
     href="https://github.com/Cyrene-Castorice114/TClaw-Web"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="在GitHub上查看源码">
    <svg class="github-fab-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    <span class="github-fab-tip">在GitHub上查看源码</span>
  </a>

  <script src="js/config.js?v=8"></script>
  <script src="js/utils.js?v=6"></script>
  <script src="js/loading.js?v=6"></script>
  <script src="js/icons.js?v=6"></script>
  <script src="js/render.js?v=6"></script>
  <script src="js/readme.js?v=6"></script>

  <script src="js/app.js?v=6"></script>

  <script src="js/click-fx.js?v=6"></script>
  <script src="js/title-fx.js?v=6"></script>
  <script src="js/particle-fx.js?v=6"></script>

  <script src="js/bg-image.js?v=6"></script>
</body>
</html>
